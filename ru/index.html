<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Крути и забери бонус | FunBet.Me</title>
  <meta name="robots" content="noindex,nofollow">

  <link rel="icon" href="https://funbet.me/favicon.ico">

  <style>
    :root{
      --bg:#2E004F;
      --gold:#D6B35A;
      --gold2:#f2d37a;
      --text:#fff;
      --muted:rgba(255,255,255,.85);
      --card:rgba(255,255,255,.08);
      --stroke:rgba(255,255,255,.12);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto;
      background:linear-gradient(180deg,#3b0a5f,#2E004F);
      color:#fff;
    }

    .wrap{
      max-width:1200px;
      margin:auto;
      padding:20px;
    }

    .hero img{
      width:100%;
      height:200px;
      object-fit:cover;
      border-radius:16px;
    }

    h1{
      font-size:48px;
      margin:20px 0 10px;
    }

    p{
      font-size:22px;
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
      margin-top:20px;
      align-items:center;
    }

    canvas{
      width:100%;
      max-width:480px;
    }

    .btnrow{
      display:flex;
      gap:15px;
      margin-top:20px;
    }

    button{
      flex:1;
      padding:18px;
      font-size:22px;
      font-weight:800;
      border-radius:16px;
      border:0;
      cursor:pointer;
    }

    .spin{
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#2a1a00;
    }

    .claim{
      background:rgba(255,255,255,.15);
      color:#fff;
    }

    .claim.active{
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#2a1a00;
      animation:flash .9s infinite;
    }

    @keyframes flash{
      50%{transform:scale(1.05);}
    }

    .result{
      margin-top:15px;
      padding:15px;
      background:rgba(0,0,0,.2);
      border-radius:12px;
      display:none;
      font-size:20px;
    }

    @media(max-width:900px){
      .grid{grid-template-columns:1fr;}
      h1{font-size:28px;}
      p{font-size:16px;}
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="hero">
    <img src="https://funbet.me/content/wp-content/uploads/2026/03/Web-mar1-w2.png">
  </div>

  <h1>Крути и открой бонус 250% + 100 фриспинов + до 10% кэшбэка 🎁</h1>
  <p>Нажми «Крутить», получи награду и забери бонус на FunBet.Me</p>

  <div class="grid">

    <div>
      <button class="spin" id="spinBtn">КРУТИТЬ</button>
      <button class="claim" id="claimBtn" disabled>Забрать бонус</button>

      <div class="result" id="resultBox"></div>
    </div>

    <div style="text-align:center">
      <canvas id="wheel" width="600" height="600"></canvas>
    </div>

  </div>

</div>

<script>
const CLAIM_URL = "https://funbet.me/ru/promotions";

const prizes = [
  "₽500 Бонус",
  "25 Фриспинов",
  "₽750 Бонус",
  "Сюрприз",
  "₽1000 Бонус",
  "₽600 Бонус"
];

const prizeValues = [500,0,750,-1,1000,600];
const weights = [18,17,18,16,13,18];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let angle=0, spinning=false, landedIndex=null;

function pick(){
  let sum=weights.reduce((a,b)=>a+b,0);
  let x=Math.random()*sum;
  for(let i=0;i<weights.length;i++){
    x-=weights[i];
    if(x<=0) return i;
  }
}

function draw(){
  ctx.clearRect(0,0,600,600);
  let cx=300, cy=300, r=260;
  let seg=(Math.PI*2)/prizes.length;

  for(let i=0;i<prizes.length;i++){
    let s=angle+i*seg;
    let e=s+seg;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,s,e);
    ctx.fillStyle=i%2?"#3a1b5e":"#4c2c72";
    ctx.fill();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(s+seg/2);
    ctx.fillStyle="#fff";
    ctx.font="18px Arial";
    ctx.fillText(prizes[i], r-20,0);
    ctx.restore();
  }
}

function spin(i){
  let seg=(Math.PI*2)/prizes.length;
  let target=-(i*seg+seg/2)+Math.PI*6;
  let start=angle;
  let d=target-start;
  let t0=performance.now();

  spinning=true;

  function anim(t){
    let p=Math.min(1,(t-t0)/4000);
    angle=start+d*(1-Math.pow(1-p,3));
    draw();

    if(p<1) requestAnimationFrame(anim);
    else{
      spinning=false;
      landedIndex=i;

      let txt = prizes[i]==="Сюрприз"
        ? "🎉 Сюрприз! Ты выиграл 250% бонус + 100 фриспинов"
        : "✅ Выпало: "+prizes[i];

      document.getElementById("resultBox").innerHTML=txt;
      document.getElementById("resultBox").style.display="block";

      let btn=document.getElementById("claimBtn");
      btn.disabled=false;
      btn.classList.add("active");
    }
  }

  requestAnimationFrame(anim);
}

document.getElementById("spinBtn").onclick=()=>{
  if(!spinning) spin(pick());
};

document.getElementById("claimBtn").onclick=()=>{
  window.location.href=CLAIM_URL;
};

draw();
</script>
</body>
</html>
