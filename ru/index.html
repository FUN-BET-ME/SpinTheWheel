<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Крути и получи бонус | FunBet.Me</title>
  <meta name="robots" content="noindex,nofollow">

  <link rel="icon" href="https://funbet.me/favicon.ico">

  <style>
    :root{
      --bg:#2E004F;
      --bg2:#3b0a5f;
      --gold:#D6B35A;
      --gold2:#f2d37a;
      --card:rgba(255,255,255,.08);
      --text:#fff;
      --muted:rgba(255,255,255,.85);
      --stroke:rgba(255,255,255,.12);
      --soft:rgba(214,179,90,.12);
      --panel:rgba(255,255,255,.05);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,var(--bg2),var(--bg));
    }

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }

    .shell{
      width:100%;
      max-width:1100px;
      background:var(--card);
      border-radius:20px;
      padding:16px;
    }

    h1{
      font-size:28px;
      margin-bottom:10px;
    }

    .sub{
      color:var(--muted);
      margin-bottom:16px;
    }

    .btnrow{
      display:flex;
      gap:10px;
      margin-bottom:12px;
    }

    button{
      flex:1;
      padding:14px;
      border-radius:12px;
      border:0;
      font-weight:700;
      cursor:pointer;
    }

    .spin{
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#000;
    }

    .claim{
      background:#444;
      color:#fff;
    }

    .claim.active{
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#000;
    }

    .result{
      display:none;
      background:#000;
      padding:12px;
      border-radius:10px;
    }

    canvas{
      width:100%;
      max-width:400px;
      display:block;
      margin:0 auto;
    }
  </style>
</head>

<body>
<div class="page">
<div class="shell">

<h1>Крути и получи 250% бонус + 100 фриспинов 🎁</h1>
<p class="sub">Нажми «Крутить», открой награду и забери бонус.</p>

<div class="btnrow">
  <button class="spin" id="spinBtn">КРУТИТЬ</button>
  <button class="claim" id="claimBtn" disabled>Забрать бонус</button>
</div>

<div id="resultBox" class="result"></div>

<canvas id="wheel"></canvas>

</div>
</div>

<script>
const CLAIM_URL = "https://funbet.me/ru/promotions";

const prizes = [
  "₽1000 бонус",
  "25 фриспинов",
  "₽1500 бонус",
  "Сюрприз 🎁",
  "₽2000 бонус",
  "₽1200 бонус"
];

const prizeValues = [1000, 0, 1500, -1, 2000, 1200];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let angle = 0;
let spinning = false;
let landedIndex = null;

function draw(){
  const size = 400;
  canvas.width = size;
  canvas.height = size;

  const cx = size/2;
  const cy = size/2;
  const r = 180;

  const seg = 2*Math.PI/prizes.length;

  for(let i=0;i<prizes.length;i++){
    const start = angle + i*seg;
    const end = start + seg;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.fillStyle = i%2 ? "#333" : "#555";
    ctx.fill();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start + seg/2);
    ctx.fillStyle="#fff";
    ctx.textAlign="right";
    ctx.font="14px Arial";
    ctx.fillText(prizes[i], r-10,5);
    ctx.restore();
  }
}

function spin(){
  if(spinning) return;
  spinning = true;

  const target = Math.floor(Math.random()*prizes.length);
  const total = 360*5 + target*(360/prizes.length);

  let current = 0;

  const anim = setInterval(()=>{
    current += 10;
    angle = current * Math.PI/180;
    draw();

    if(current >= total){
      clearInterval(anim);
      spinning=false;
      landedIndex = target;

      const prize = prizes[target];

      if(prize.includes("Сюрприз")){
        resultBox.innerHTML = "🎉 Ты выиграл <b>250% бонус + 100 фриспинов</b>";
      } else {
        resultBox.innerHTML = "✅ Выпало: " + prize;
      }

      resultBox.style.display="block";
      claimBtn.disabled=false;
      claimBtn.classList.add("active");
    }

  },20);
}

spinBtn.onclick = spin;

claimBtn.onclick = ()=>{
  if(landedIndex===null) return;

  const url = new URL(CLAIM_URL);

  if(prizes[landedIndex].includes("Сюрприз")){
    url.searchParams.set("bonus_value","250");
  } else {
    url.searchParams.set("bonus_value", prizeValues[landedIndex]);
  }

  window.location.href = url.toString();
};

draw();
</script>

</body>
</html>
