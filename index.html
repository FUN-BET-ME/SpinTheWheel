<script>
  const CLAIM_URL = "https://funbet.me/en/promotions";
  const TELEGRAM_URL = "https://t.me/FunBetDotMe";
  const BASE_PATH = "/SpinTheWheel";

  const prizes = [
    "€10 Bonus",
    "25 Free Spins",
    "€15 Bonus",
    "Surprise Bonus",
    "€20 Bonus 🎯",
    "€12 Bonus"
  ];

  const prizeValues = [10, 0, 15, -1, 20, 12];
  const weights = [18, 17, 18, 16, 13, 18];

  const currentParams = new URLSearchParams(window.location.search);

  const claimUrlObj = new URL(CLAIM_URL);
  currentParams.forEach((v,k)=> claimUrlObj.searchParams.set(k,v));
  document.getElementById("promoLink").href = claimUrlObj.toString();

  const telegramUrlObj = new URL(TELEGRAM_URL);
  currentParams.forEach((v,k)=> telegramUrlObj.searchParams.set(k,v));
  document.getElementById("telegramBtn").href = telegramUrlObj.toString();

  document.querySelectorAll(".langbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const lang = (btn.dataset.lang || "").trim();
      const target = lang === "" ? `${BASE_PATH}/` : `${BASE_PATH}/${lang}/`;
      window.location.href = target + (window.location.search || "");
    });
  });

  const canvas    = document.getElementById("wheel");
  const ctx       = canvas.getContext("2d");
  const spinBtn   = document.getElementById("spinBtn");
  const claimBtn  = document.getElementById("claimBtn");
  const resultBox = document.getElementById("resultBox");

  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const rOuter = 300, rInner = 70;

  let angle = 0;
  let spinning = false;
  let landedIndex = null;

  function pickWeightedIndex(){
    const sum = weights.reduce((a,b)=>a+b,0);
    let x = Math.random()*sum;
    for (let i=0;i<weights.length;i++){
      x -= weights[i];
      if (x <= 0) return i;
    }
    return weights.length - 1;
  }

  function drawWheel(){
    ctx.clearRect(0,0,W,H);

    ctx.beginPath();
    ctx.arc(cx, cy, rOuter + 10, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(214,179,90,0.10)";
    ctx.fill();

    const seg = (Math.PI * 2) / prizes.length;

    for (let i=0;i<prizes.length;i++){
      const start = angle + i*seg;
      const end   = start + seg;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, rOuter, start, end);
      ctx.closePath();
      ctx.fillStyle = (i % 2 === 0) ? "rgba(255,255,255,0.10)" : "rgba(0,0,0,0.18)";
      ctx.fill();

      ctx.strokeStyle = "rgba(214,179,90,0.28)";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + seg/2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.font = "700 21px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillText(prizes[i], rOuter - 18, 8);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, rInner, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, rInner, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(214,179,90,0.95)";
    ctx.lineWidth = 6;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, rInner - 10, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(214,179,90,0.35)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "rgba(214,179,90,0.98)";
    ctx.font = "900 24px system-ui, -apple-system, Segoe UI, Roboto, Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("SPIN", cx, cy);
  }

  function easeOutCubic(t){
    return 1 - Math.pow(1-t, 3);
  }

  function spinToIndex(targetIndex){
    const seg = (Math.PI*2)/prizes.length;
    const pointerAngle = -Math.PI/2;
    const targetCenter = pointerAngle - (targetIndex*seg + seg/2);
    const extraTurns = 6;
    const target = targetCenter + extraTurns * Math.PI*2;

    const startAngle = angle;
    const delta = target - startAngle;

    const duration = 4200;
    const start = performance.now();

    spinning = true;
    claimBtn.disabled = true;
    claimBtn.classList.remove("active");
    resultBox.style.display = "none";
    landedIndex = null;

    function frame(now){
      const t = Math.min(1, (now - start)/duration);
      angle = startAngle + delta * easeOutCubic(t);
      drawWheel();

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        landedIndex = targetIndex;

        if (prizes[targetIndex] === "Surprise Bonus") {
          resultBox.innerHTML =
            `🎉 <b>Surprise! You won 250% bonus + 100 Free Spins</b><br/>Tap <b>Claim Bonus</b> now to continue to FunBet.Me.`;
        } else {
          resultBox.innerHTML =
            `✅ <b>Unlocked:</b> ${prizes[targetIndex]}<br/>Tap <b>Claim Bonus</b> to continue to FunBet.Me.`;
        }

        resultBox.style.display = "block";
        claimBtn.disabled = false;
        claimBtn.classList.add("active");
      }
    }

    requestAnimationFrame(frame);
  }

  spinBtn.addEventListener("click", ()=>{
    if (spinning) return;
    spinToIndex(pickWeightedIndex());
  });

  claimBtn.addEventListener("click", ()=>{
    if (claimBtn.disabled) return;

    if (landedIndex !== null) {
      if (prizes[landedIndex] === "Surprise Bonus") {
        claimUrlObj.searchParams.set("bonus_value", "250");
        claimUrlObj.searchParams.set("wheel_prize", "250% bonus + 100 Free Spins");
        claimUrlObj.searchParams.set("offer", "250_100fs");
      } else {
        claimUrlObj.searchParams.set("bonus_value", String(prizeValues[landedIndex]));
        claimUrlObj.searchParams.set("wheel_prize", prizes[landedIndex]);
      }
    }

    window.location.href = claimUrlObj.toString();
  });

  drawWheel();
</script>
